name: RentCar DevOps CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  docker-build:
    name: Validate and build Docker images
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # DEVOPS REPOSITORY
      # ============================================================

      - name: Checkout DevOps repository
        uses: actions/checkout@v5
        with:
          path: rentcar-devops
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          fetch-depth: 1

      # ============================================================
      # BACKEND REPOSITORY
      # ============================================================

      - name: Checkout Backend repository
        uses: actions/checkout@v5
        with:
          repository: PandeyMohit20/rentcar-backend
          path: rentcar-backend
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          fetch-depth: 1

      # ============================================================
      # FRONTEND REPOSITORY
      # ============================================================

      - name: Checkout Frontend repository
        uses: actions/checkout@v5
        with:
          repository: PandeyMohit20/rentcar-frontend
          path: rentcar-frontend
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          fetch-depth: 1

      # ============================================================
      # ADMIN REPOSITORY
      # ============================================================

      - name: Checkout Admin repository
        uses: actions/checkout@v5
        with:
          repository: PandeyMohit20/rentcar-admin
          path: rentcar-admin
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          fetch-depth: 1

      # ============================================================
      # VERIFY STRUCTURE
      # ============================================================

      - name: Verify repository structure
        shell: bash
        run: |
          echo "Workspace:"
          pwd

          echo
          echo "Repositories:"
          ls -la

          echo
          echo "DevOps:"
          test -f rentcar-devops/docker-compose.yml

          echo "Backend:"
          test -f rentcar-backend/package.json

          echo "Frontend:"
          test -f rentcar-frontend/package.json

          echo "Admin:"
          test -f rentcar-admin/package.json

          echo
          echo "Repository structure verified successfully."

      # ============================================================
      # CI ENVIRONMENT
      # ============================================================

      - name: Create CI environment file
        shell: bash
        working-directory: rentcar-devops
        run: |
          cat > .env.docker <<'EOF'
          MYSQL_DATABASE=rentcar
          MYSQL_USER=rentcar
          MYSQL_PASSWORD=ci_local_password
          MYSQL_ROOT_PASSWORD=ci_root_password

          BACKEND_PORT=5000
          FRONTEND_PORT=5173
          ADMIN_PORT=5174

          JWT_ACCESS_SECRET=ci_access_secret
          JWT_REFRESH_SECRET=ci_refresh_secret
          JWT_ACCESS_EXPIRES_IN=15m
          JWT_REFRESH_EXPIRES_IN=7d

          CORS_ORIGIN=http://localhost:5173,http://localhost:5174

          LOG_LEVEL=info

          COOKIE_SECURE=false
          COOKIE_SAME_SITE=lax
          COOKIE_DOMAIN=

          QUOTE_TTL_MINUTES=10
          QUOTE_SIGNING_SECRET=ci_quote_signing_secret
          BOOKING_HOLD_TTL_MINUTES=15

          PAYMENT_PROVIDER=razorpay
          RAZORPAY_KEY_ID=
          RAZORPAY_KEY_SECRET=
          RAZORPAY_WEBHOOK_SECRET=

          PAYOUT_DESTINATION_ENCRYPTION_KEY=
          EOF

      # ============================================================
      # COMPOSE VALIDATION
      # ============================================================

      - name: Validate Docker Compose
        working-directory: rentcar-devops
        run: |
          docker compose --env-file .env.docker config

      # ============================================================
      # DOCKER BUILDS
      # ============================================================

      - name: Build backend image
        working-directory: rentcar-devops
        run: |
          docker compose --env-file .env.docker build backend

      - name: Build frontend image
        working-directory: rentcar-devops
        run: |
          docker compose --env-file .env.docker build frontend

      - name: Build admin image
        working-directory: rentcar-devops
        run: |
          docker compose --env-file .env.docker build admin